name: Windows integration build

on:
  workflow_dispatch:
  push:
    branches: [codex/llama-monitor-integration]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned Windows dependencies
        run: >-
          git submodule update --init --recursive
          third-party/build-deps third-party/googletest
          third-party/libdisplaydevice third-party/nanors
          third-party/nv-codec-headers third-party/nvapi-open-source-sdk
          third-party/Simple-Web-Server third-party/TPCircularBuffer
          third-party/tray third-party/ViGEmClient third-party/moonlight-common-c
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nlohmann_json
      - name: Test independent sessions
        shell: msys2 {0}
        run: |
          mkdir -p build
          g++ -std=c++23 -pthread -I. -Ithird-party/googletest/googletest/include -Ithird-party/googletest/googletest \
            tests/unit/test_auth_sessions.cpp third-party/googletest/googletest/src/gtest-all.cc \
            third-party/googletest/googletest/src/gtest_main.cc -o build/test_auth_sessions.exe
          build/test_auth_sessions.exe --gtest_output=xml:build/auth-tests.xml
      - name: Build Apollo
        shell: msys2 {0}
        run: |
          export BRANCH=codex/llama-monitor-integration
          export COMMIT="$(git rev-parse HEAD)"
          export BUILD_VERSION="0.4.6-llama-auth.${COMMIT:0:8}"
          cmake -B build -G Ninja -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DSUNSHINE_PUBLISHER_NAME=ridaken \
            -DSUNSHINE_PUBLISHER_WEBSITE=https://github.com/ridaken/Apollo \
            -DSUNSHINE_PUBLISHER_ISSUE_URL=https://github.com/ridaken/Apollo/issues
          cmake --build build --parallel 2
          cpack -G ZIP --config build/CPackConfig.cmake
      - name: Record source and checksums
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          $packages = @(Get-ChildItem -LiteralPath build/cpack_artifacts -Filter '*.zip')
          if ($packages.Count -eq 0) { throw 'No Windows package produced.' }
          $manifest = @{
            source_repository = 'https://github.com/ridaken/Apollo'
            source_commit = $revision
            upstream_base = '0cd32abaaa141d262477d039ac447b38fe99c394'
            auth_sessions = 'multiple-v1'
            packages = @($packages | ForEach-Object { @{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() } })
            dependencies = @(git submodule status --recursive)
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath build-manifest.json -Encoding utf8
          $packages | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -LiteralPath SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-windows-${{ github.sha }}
          path: |
            build/cpack_artifacts/*.zip
            build-manifest.json
            SHA256SUMS
            build/auth-tests.xml
          if-no-files-found: error
